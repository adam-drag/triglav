services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orchestrator
      MYSQL_USER: orchestrator
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    # Limits keep a runaway query or a leak from taking the whole machine.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  orchestrator:
    build: .
    environment:
      DATABASE_URL: mysql://orchestrator:${MYSQL_PASSWORD}@mysql:3306/orchestrator
      ORCH_ENROLLMENT_KEY: ${ORCH_ENROLLMENT_KEY:?Set ORCH_ENROLLMENT_KEY in .env}
      ORCH_RUNNER_KEY: ${ORCH_RUNNER_KEY:?Set ORCH_RUNNER_KEY in .env (openssl rand -hex 24, different from ORCH_ENROLLMENT_KEY)}
      ORCH_CLIENT_PASSWORD_HASH: ${ORCH_CLIENT_PASSWORD_HASH:?Run node scripts/set-password.ts to set the dashboard password}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      ORCH_BIND: 0.0.0.0
      ORCH_PORT: "7400"
      # The agents' and the runner's address on this machine. It must stay a loopback URL; the server refuses another.
      ORCH_PUBLIC_URL: http://localhost:7400
      # Opt-in public dashboard listener for an HTTPS reverse proxy (README "Running behind an HTTPS reverse proxy").
      # Set ORCH_DASHBOARD_URL in .env, then uncomment these two lines and the 7410 port below.
      # ORCH_DASHBOARD_URL: ${ORCH_DASHBOARD_URL:?Set ORCH_DASHBOARD_URL in .env}
      # ORCH_DASHBOARD_PORT: ${ORCH_DASHBOARD_PORT:-7410}
      ORCH_CLAUDE_DIR: /telemetry/claude
      ORCH_CODEX_DIR: /telemetry/codex
      # Expands a leading ~ in the repository path of a new job.
      ORCH_HOST_HOME: ${HOME}
    # Read-only: token usage, pushes and PRs are read from the agents' CLI transcripts.
    volumes:
      - ${HOME}/.claude/projects:/telemetry/claude:ro
      - ${HOME}/.codex/sessions:/telemetry/codex:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    # Published on the loopback interface only. Agents and the dashboard run on this machine.
    ports:
      - "127.0.0.1:7400:7400"
      # The public dashboard listener, for the reverse proxy on this machine. Keep it on loopback (or the proxy's private
      # network), never on a public interface. Change both numbers if you set another ORCH_DASHBOARD_PORT.
      # - "127.0.0.1:7410:7410"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
